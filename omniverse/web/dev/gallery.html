<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#1b1d2e;display:grid;grid-template-columns:repeat(6,1fr);gap:4px}canvas{width:100%;background:linear-gradient(#3a4a7a,#1b1d2e)}div{color:#fff;font:12px sans-serif;text-align:center}</style></head><body>
<script type="module">
import { ROSTER } from '../js/data/roster.js';
import { drawPortrait } from '../js/render/drawFighter.js';
for (const c of ROSTER) for (const s of c.skins) {
  const w = document.createElement('div');
  const cv = document.createElement('canvas'); cv.width = 260; cv.height = 300;
  w.append(cv, document.createTextNode(`${c.name} — ${s.name}`));
  document.body.append(w);
  drawPortrait(cv, c, s, { zoom: 1.25 });
}
window.done = true;
</script></body></html>
